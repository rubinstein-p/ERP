{% extends 'base.html' %}

{% block title %}Eliminar Rol - ERP Sistema{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm mt-4">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="fas fa-trash"></i> Confirmar eliminación de rol</h5>
            </div>
            <div class="card-body">
                <p>¿Deseas eliminar el rol <strong>{{ object.name }}</strong>?</p>
                <p class="text-muted mb-0">Si hay usuarios asignados, perderán este rol inmediatamente.</p>
            </div>
            <div class="card-footer bg-white d-flex justify-content-end gap-2">
                <a href="{% url 'core:role_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                <form method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
