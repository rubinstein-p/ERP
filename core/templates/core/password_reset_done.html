{% extends 'base.html' %}

{% block title %}Email enviado - ERP{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-body p-5 text-center">
                <i class="fas fa-check-circle fa-3x text-success mb-3"></i>
                <h2 class="h4">Revisa tu email</h2>
                <p class="text-muted">Si el correo existe en el sistema, recibirás un enlace para restablecer tu contraseña.</p>
                <a href="{% url 'core:login' %}" class="btn btn-outline-primary mt-3">Volver a iniciar sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
