{% extends 'base.html' %}

{% block title %}Contraseña restablecida - ERP{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-body p-5 text-center">
                <i class="fas fa-check-circle fa-3x text-success mb-3"></i>
                <h2 class="h4">Contraseña restablecida</h2>
                <p class="text-muted">Tu contraseña se ha actualizado correctamente. Ahora puedes iniciar sesión con la nueva contraseña.</p>
                <a href="{% url 'core:login' %}" class="btn btn-primary mt-3">Iniciar sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
