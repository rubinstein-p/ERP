<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error interno del servidor - ERP Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="text-center">
            <div class="mb-4 text-danger">
                <i class="fas fa-triangle-exclamation" style="font-size: 5rem;"></i>
            </div>
            <h1 class="display-4 fw-bold text-danger">500</h1>
            <h2 class="h4 mb-3">Error interno del servidor</h2>
            <p class="text-muted mb-4">

                Intentalo nuevamente en unos minutos.
            </p>
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home me-1"></i> Ir al inicio
            </a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
